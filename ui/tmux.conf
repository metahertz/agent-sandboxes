# tmux server for Claude sessions started by the web UI (socket: -L agent-sandboxes).
# Attach from a shell with: tmux -L agent-sandboxes attach -t cl-<workspace>
set -g remain-on-exit on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g window-size latest
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[#{s/^cl-//:session_name}] "
set -g status-right "scroll: wheel / C-b [ · select: shift-drag · detach: C-b d"

# Whoever is attached (web terminal, or SSH with a workspace key) must not be
# able to run tmux commands: new-window / split / command-prompt would give an
# unsandboxed host shell, choose-tree another workspace's session. Keep only
# detach and scrollback (copy mode runs nothing).
unbind-key -a -T prefix
unbind-key -a -T root
bind-key d detach-client
bind-key [ copy-mode
bind-key PageUp copy-mode -u

# The mouse wheel / trackpad scrolls back (laptops have no PageUp): it enters
# copy mode, which scrolling back to the bottom leaves (-e). Only the wheel is
# bound here (no right-click menu, no status-line clicks); a program in the
# pane that asks for the mouse gets it. Selecting text in the web terminal
# takes Shift-drag (Option-drag on a Mac), as tmux now receives plain drags.
set -g mouse on
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
bind-key -T root WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M"
bind-key -T root MouseDown1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M"
bind-key -T root MouseDrag1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M"
bind-key -T root MouseUp1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M"
