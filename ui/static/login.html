<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Sandboxes</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --code: #e9e9e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #e8e8e3; --muted: #9a9a93; --code: #252523; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 12vh auto; padding: 0 1.25rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  pre, code { background: var(--code); border-radius: 6px; font: 13px ui-monospace, monospace; }
  pre { padding: .75rem 1rem; overflow-x: auto; }
  code { padding: .1rem .3rem; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Agent Sandboxes</h1>
    <p>Open the login link that <code>bin/sandbox-ui</code> printed when it started:</p>
    <pre>https://&lt;host&gt;/login?token=…</pre>
    <p class="muted">The token is in <code>~/agent-sandboxes/ui/token</code>.
      Certificate warning? Import <a href="/ca.crt">this host's CA certificate</a> (see the README).</p>
  </main>
</body>
</html>
