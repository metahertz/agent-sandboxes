# tmux server for the web UI's Host page (socket: -L agent-sandboxes-host): a
# login shell on this host, apart from the locked-down server Claude's sessions
# use. Ordinary tmux otherwise (C-b c, splits, ...): it's your own shell.
# Attach from an SSH login with: tmux -L agent-sandboxes-host attach -t host
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g window-size latest
set -g status-style "bg=colour52,fg=colour255"
set -g status-left "[host] "
set -g status-right "scroll: wheel / C-b [ · select: shift-drag · exit ends the shell"

# The wheel scrolls back (into copy mode, left by scrolling to the bottom); a
# program that asks for the mouse gets it. Selecting text: Shift-drag
# (Option-drag on a Mac).
set -g mouse on
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
